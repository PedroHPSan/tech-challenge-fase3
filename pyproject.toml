[tool.poetry]
name = "techchallenge-fase3"
version = "0.1.0"
description = "Triagem automática de textos médicos: API de inferência, CI/CD e orquestração de retreino"
authors = ["Pedro Santos <pedropalhetasantos@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = ">=2.2"
scikit-learn = ">=1.5"
joblib = ">=1.4"
fastapi = ">=0.110"
uvicorn = { version = ">=0.29", extras = ["standard"] }
pydantic-settings = ">=2.4"
httpx = ">=0.27"
prometheus-client = ">=0.20"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.5"

[tool.poetry.group.airflow]
optional = true

[tool.poetry.group.airflow.dependencies]
apache-airflow = ">=2.10,<3"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
